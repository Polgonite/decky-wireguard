minimum_pre_commit_version: "4.2.0"
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Lint Python
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: eslint
        name: Lint JavaScript and TypeScript
        entry: uv run --locked npm run lint
        language: system
        files: '\.(js|tsx?)$'
        pass_filenames: false
      - id: typecheck
        name: Type-check frontend
        entry: uv run --locked npm run typecheck
        language: system
        files: '(^src/|^tsconfig\.json$|^package(-lock)?\.json$)'
        pass_filenames: false
      - id: backend-tests
        name: Run backend tests
        entry: uv run --locked npm test
        language: system
        types: [python]
        pass_filenames: false
      - id: actionlint
        name: Lint GitHub Actions workflows and embedded shell
        entry: uv run --locked actionlint
        language: system
        files: '^\.github/workflows/.*\.ya?ml$'
        pass_filenames: false
