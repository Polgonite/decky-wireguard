name: Development release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Pre-commit checks in uv venv
    # Disabled: checks run locally before pushing. Remove this line to re-enable.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install development dependencies
        run: |
          uv sync --locked
          uv run --locked npm ci

      - name: Run pre-commit checks
        run: uv run --locked pre-commit run --all-files

  release:
    name: Build and publish development release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Re-enable together with the checks job above.
    # needs: checks
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          uv run --locked npm ci

      - name: Assign unique development version
        id: version
        shell: bash
        run: |
          base_version="$(uv run --locked node -p "require('./package.json').version.split('-')[0]")"
          version="${base_version}-dev.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.sha${GITHUB_SHA:0:7}"
          uv run --locked npm version "$version" --no-git-tag-version --ignore-scripts
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run backend tests
        run: uv run --locked npm test

      - name: Build installable ZIP
        run: uv run --locked npm run package

      - name: Verify installable ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          version = os.environ["VERSION"]
          with ZipFile(f"out/decky-wireguard-{version}.zip") as archive:
              assert archive.testzip() is None, "Corrupt ZIP archive"
              expected = {
                  "plugin.json", "package.json", "main.py", "dist/index.js", "README.md"
              }
              expected.update(
                  f"docs/{path.relative_to('docs').as_posix()}"
                  for path in Path("docs").rglob("*.md")
              )
              assert set(archive.namelist()) == {
                  f"decky-wireguard/{name}" for name in expected
              }, "Unexpected ZIP layout"
              package = json.loads(archive.read("decky-wireguard/package.json"))
              assert package["version"] == version, "Incorrect embedded version"
              assert archive.getinfo("decky-wireguard/dist/index.js").file_size > 0
          PY

      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "v${VERSION}" \
            "out/decky-wireguard-${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "Development build ${VERSION}" \
            --notes "Automated development build of commit ${GITHUB_SHA}. Not a stable release. Install the attached ZIP through Decky Loader. Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --prerelease \
            --latest=false
