name: CI and release

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# Serialize builds per branch so two pushes cannot race to publish the same version.
# Superseded pull request runs are canceled; running releases never are (GitHub
# still replaces an older waiting run with the newest one).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # Required status check on main (see docs/development.md#branch-protection); keep the name stable.
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install development dependencies
        id: deps
        run: |
          uv sync --locked
          uv run --locked npm ci

      - name: Lint, type-check, and test (pre-commit)
        run: |
          if ! command -v nmcli >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends network-manager
          fi
          uv run --locked pre-commit run --all-files

      - name: Validate release version
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.base_ref || github.ref_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$TARGET" = main ] &&
            { [ "$HEAD_BRANCH" != dev ] || [ "$HEAD_REPO" != "$GH_REPO" ]; }; then
            echo "::error::Stable releases are promoted from dev. Target dev with this pull request instead of main."
            exit 1
          fi
          channel=development
          if [ "$TARGET" = main ]; then channel=stable; fi
          gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags/v" --jq '.[].ref' |
            uv run --locked python tools/release_version.py select --channel "$channel" \
              --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --sha "$GITHUB_SHA"

      - name: Build and verify installable ZIP
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          uv run --locked npm run package
          uv run --locked python tools/verify_package.py "$(uv run --locked node -p "require('./package.json').version")"

  release:
    # Static name: GitHub shows expressions in the names of skipped jobs unevaluated.
    name: Publish release
    # Pull requests only run the checks. Publication needs a push and successful checks.
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          uv run --locked npm ci

      - name: Select version and release channel
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          channel=development
          if [ "$BRANCH" = main ]; then channel=stable; fi
          gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags/v" --jq '.[].ref' |
            uv run --locked python tools/release_version.py select --channel "$channel" \
              --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --sha "$GITHUB_SHA" \
              --output "$GITHUB_OUTPUT"

      - name: Embed development version
        if: steps.version.outputs.channel == 'development'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv run --locked npm version "$VERSION" --no-git-tag-version --ignore-scripts

      - name: Build installable ZIP
        run: uv run --locked npm run package

      - name: Verify installable ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv run --locked python tools/verify_package.py "$VERSION"

      - name: Publish stable release
        if: steps.version.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          KIND: ${{ steps.version.outputs.kind }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        shell: bash
        run: |
          if [ -n "$PREVIOUS" ]; then
            summary="Stable ${KIND} release after ${PREVIOUS}"
            since=(--notes-start-tag "$PREVIOUS")
          else
            summary="First stable release"
            since=()
          fi
          gh release create "v${VERSION}" \
            "out/decky-wireguard-${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "WireGuard ${VERSION}" \
            --notes "${summary}, built from commit ${GITHUB_SHA}. Install the attached ZIP through Decky Loader, or update from the plugin's settings. Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --generate-notes "${since[@]}" \
            --latest

      - name: Publish development prerelease
        if: steps.version.outputs.channel == 'development'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "v${VERSION}" \
            "out/decky-wireguard-${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "Development build ${VERSION}" \
            --notes "Automated development build of commit ${GITHUB_SHA}. Not a stable release. Install the attached ZIP through Decky Loader. Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --prerelease \
            --latest=false

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        shell: bash
        run: |
          tag="v${VERSION}"
          asset="decky-wireguard-${VERSION}.zip"
          prerelease=false
          if [ "$CHANNEL" = development ]; then prerelease=true; fi

          tag_target="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '"\(.object.type) \(.object.sha)"')"
          if [ "$tag_target" != "commit ${GITHUB_SHA}" ]; then
            echo "::error::Tag ${tag} points to '${tag_target}' instead of commit ${GITHUB_SHA}."
            exit 1
          fi
          if ! gh api "repos/${GH_REPO}/releases/tags/${tag}" | jq -e \
              --arg asset "$asset" --arg sha "$GITHUB_SHA" --argjson prerelease "$prerelease" \
              '.draft == false and .prerelease == $prerelease and .target_commitish == $sha
                and (.body | contains($sha)) and [.assets[].name] == [$asset]' >/dev/null; then
            echo "::error::Release ${tag} does not have the expected prerelease flag, commit, notes, or single asset ${asset}."
            exit 1
          fi
          gh release download "$tag" --pattern "$asset" --dir "${RUNNER_TEMP}/published"
          if ! cmp "out/${asset}" "${RUNNER_TEMP}/published/${asset}"; then
            echo "::error::The published ${asset} differs from the verified build."
            exit 1
          fi
          if [ "$CHANNEL" = stable ] && [ "$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)" != "$tag" ]; then
            echo "::error::${tag} is not marked as the latest release."
            exit 1
          fi
          echo "Published ${tag} from ${GITHUB_SHA} with verified asset ${asset}."
